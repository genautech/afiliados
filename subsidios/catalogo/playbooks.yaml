# Playbooks operacionais exibidos em /conhecimento.
#
# Este conteúdo vivia hardcoded em app/(app)/conhecimento/page.tsx, fora do catálogo e
# portanto fora de qualquer revisão de procedência. Trazer para cá coloca o material
# sob o mesmo build que valida o resto dos subsídios.
#
# `icone` é o nome lógico; o mapeamento para o componente Lucide fica na página.
schema: 1
atualizado_em: '2026-08-29'
grupos:
  - id: estrategias
    titulo: Estratégias
    icone: target
    secoes:
      - titulo: "Seleção de Ofertas"
        conteudo: |-
          **ClickBank:** Gravity (oferta viva), EPC de referência, avg sale, upsells. Ler Vendor Terms: geo, tráfego, trademark, claims. Testar LP/VSL no mobile. HopLink + UTMs.

          **BuyGoods:** Payout vs CPC esperado no geo. Criativos oficiais + ângulos próprios sem violar claims. Confirmar se exige bridge / proíbe direct / landing approval.

          **MaxWeb:** Vertical + payout (CPL vs CPA vs RevShare). Smartlink para descoberta; offer fixa após vencedor. Nunca escalar sem postback validado. Monitorar held/rejected/clawback semanalmente.

          **Hotmart/Eduzz/Monetizze:** Comissão %, qualidade da página, calendário de lançamento. Materiais oficiais + ângulo da sua audiência.

          **Shortlist:** 2–3 CB/BuyGoods + 1 path MaxWeb + 1 BR
      - titulo: "Funis"
        conteudo: |-
          1. **Direct** — anúncio → hop/smartlink (teste rápido)
          2. **Bridge / Review** — anúncio → sua página → CTA afiliado (padrão Google)
          3. **Search Intent** — keyword problema/solução → RSA → bridge
          4. **YouTube / Demand Gen** — UGC/talking-head → bridge ou SL
          5. **PMax** — só após conversões estáveis
          6. **Lançamento BR** — conteúdo/lista → carrinho
          7. **MaxWeb Smartlink** — tráfego → SL → pin na offer vencedora
      - titulo: "Métricas e Decisão"
        conteudo: |-
          | Métrica | Uso |
          |---------|-----|
          | EPC | Receita líquida / cliques |
          | eCPA | Gasto / conversões |
          | ROAS | Receita / gasto |
          | CVR | Conv / cliques |

          **SCALE:** EPC ≥ 1,3 × CPC ou eCPA < payout líquido com margem
          **KILL:** sem conversão com gasto ≥ orçamento de teste
          **OTIMIZAR:** perto do break-even
  - id: googleads
    titulo: Google Ads
    icone: grafico
    secoes:
      - titulo: "Arquitetura de Conta"
        conteudo: |-
          1 campanha = 1 rede × 1 vertical × 1 geo × 1 canal × 1 funil
          Naming: [REDE]_[VERTICAL]_[GEO]_[CANAL]_[FUNIL]_vN

          Exemplos:
          CB_WL_US_SEARCH_BRIDGE_v1
          MW_NUTRA_BR_YT_SL_v1
          BG_BEAUTY_US_DGEN_REVIEW_v2
      - titulo: "Search para Afiliados"
        conteudo: |-
          **Quando usar:** Intent alto, problema claro, comparação.

          **Estrutura:** Campanha por tema/oferta. Ad groups por cluster de intenção.
          Match: exact + phrase no começo.

          **RSA:** 10-15 títulos, 4 descrições. Alinhar H1 da bridge à keyword.
          Evitar claims absolutos. CTA: "veja como funciona", "compare".

          **Lances:** Início manual CPC. Com 30+ conv/mês: tCPA.
      - titulo: "YouTube, Demand Gen e PMax"
        conteudo: |-
          **YouTube:** Hook 0-3s; problema; mecanismo; CTA para bridge. Remarketing viewers.

          **Demand Gen:** Criativos feed + vídeo curto. Bridge obrigatória.

          **PMax:** SÓ DEPOIS de conversões confiáveis e Search/YT já lucrativos. Segmente por oferta.
      - titulo: "Compliance Google × Redes"
        conteudo: |-
          | Risco | Ação |
          |-------|------|
          | Claims saúde/renda | Linguagem condicional, sem garantia |
          | Trademark | Respeitar Vendor Terms + políticas Google |
          | Cloaking | Proibido |
          | Vertical restrita | Verificar certificação |
          | Destino | Página útil, não só hop opaco |

          **Regra de ouro:** anúncio approvável no Google E permitido nos terms da oferta
  - id: playbooks
    titulo: Playbooks
    icone: documento
    secoes:
      - titulo: "Tipos de Página para Afiliados (Mercado Internacional)"
        conteudo: |-
          **Regra geral:** no mercado internacional (US, CA, AU, UK, EU) você precisa de uma **página própria** entre o anúncio do Google e o produtor. Links de afiliado criptografados (hop links) não são aceitos como URL final no Google Ads desde ~2022/2023.

          **VSL (Video Sales Letter)**
          - Página centrada em vídeo de vendas.
          - Use só se o produtor não liberar outra página ou se o vídeo for muito forte.
          - Não é o primeiro na lista de prioridades.

          **TSL (Text Sales Letter)**
          - Página longa de texto com botões de compra.
          - Funciona bem se a TSL oficial for atrativa: botões visíveis, imagem do produto, informações claras.
          - Se a TSL oficial for "feia" (botões escondidos, design ruim), prefira uma página própria.

          **Cookie / Popup**
          - Página simples para marcar o cookie do afiliado e redirecionar para a página oficial.
          - É o formato mais usado por afiliados iniciantes e intermediários.
          - Rápido de criar, funciona para produtos com marca já pesquisada.

          **Review / Robusta**
          - Artigo review com comparação, prós/contras, depoimentos, FAQ e CTA.
          - Melhor para quem já domina taxa de fuga, usa heatmap (Microsoft Clarity) e quer ranquear no Google.
          - Mais trabalho, mas tende a converter melhor a longo prazo.

          **Como escolher:**
          1. Iniciante → Cookie/Popup ou TSL boa do produtor.
          2. Intermediário → TSL otimizada ou Review simples.
          3. Avançado com dados → Review/Robusta + testes A/B.
      - titulo: "Playbook Search + ClickBank/BuyGoods (72h)"
        conteudo: |-
          1. BreakEven: comissão, refund 5-15%, CVR 1-2%
          2. 1 campanha, 2-3 ad groups, 3-5 RSA, bridge única
          3. Orçamento = 1-2× comissão média por dia
          4. Dia 1-2: matar keywords com gasto alto zero conv
          5. Dia 3: se EPC ≥ 1,3× CPC → SCALE +20-30%
      - titulo: "Playbook YT/DGen + MaxWeb SL"
        conteudo: |-
          1. Postback OK + 3 criativos (hooks diferentes)
          2. Orçamento até 100-300 cliques ou 10-20 leads
          3. eCPA vs payout: se eCPA < 70-80% → escalar
          4. Held alto → cortar fonte/criativo
      - titulo: "Diagnóstico Rápido"
        conteudo: |-
          | Sintoma | Causa | Ação |
          |---------|-------|------|
          | CTR baixo | RSA fraco, keyword ampla | Reescrever; apertar match |
          | CPC alto | Competição, QS baixo | Bridge melhor; exact; negativas |
          | CTR ok, zero vendas | LP fraca, offer morta | Trocar offer; melhorar bridge |
          | Google conv ≠ rede | Postback/UTM | Corrigir tracking |
          | Ban/disapprove | Claims, cloaking | Reescrever; bridge limpa |
  - id: templates
    titulo: Templates
    icone: ideia
    secoes:
      - titulo: "Template Bridge (Google-friendly)"
        conteudo: |-
          H1 alinhado à keyword
          Subhead benefício específico
          Empatia (problema)
          O que é a solução (sem milagre)
          Prova realista
          Prós e contras
          Para quem é / não é
          CTA → hop / smartlink
          FAQ + garantia do produto
          Disclaimer afiliado + "resultados variam"
          Privacidade / contato
      - titulo: "RSA Esqueleto"
        conteudo: |-
          Títulos: {Keyword} Guia 2026 | Como Funciona | Compare Antes | Opção Que Estão Testando
          Descrições: Entenda prós e contras. Conteúdo informativo + oferta oficial. Resultados individuais variam.
      - titulo: "Hipótese de Teste"
        conteudo: |-
          Se eu usar o ângulo [X] no canal [Search/YT] para a oferta [Y] no geo [Z],
          então EPC sobe para ≥ 1,3× CPC em [N] cliques,
          porque [motivo].
      - titulo: "UTMs Obrigatórios"
        conteudo: |-
          ?utm_source=google
          &utm_medium=cpc
          &utm_campaign=[NAMING]
          &utm_content={creative}
          &utm_term={keyword}

          MaxWeb: adicionar clickid/subid nos tokens da rede
  - id: checklists
    titulo: Checklists
    icone: checklist
    secoes:
      - titulo: "Checklist Pré-escala Google + MaxWeb"
        conteudo: |-
          ☐ Terms da oferta lidos (geo, trademark, claims)
          ☐ Bridge com disclaimer, privacidade, mobile OK
          ☐ Conversões Google testadas (fire real)
          ☐ MaxWeb: postback + clickid + 1 conv teste
          ☐ UTMs = Campanha_ID
          ☐ Break-even calculado; CPC alvo definido
          ☐ Negativas base + exclusões
          ☐ Orçamento de teste definido
          ☐ Plano B de criativo/ângulo
          ☐ Lucro medido pela rede
      - titulo: "Checklists Gerais"
        conteudo: |-
          ☐ Contas: CB, BuyGoods, MaxWeb, BR, Google Ads
          ☐ Planilha de tracking preenchida
          ☐ Shortlist de ofertas com terms OK
          ☐ Funil escolhido por campanha
          ☐ Compliance revisado
          ☐ Kill/scale documentado
          ☐ Reserva para refund/clawback
      - titulo: "Referência Rápida Break-even"
        conteudo: |-
          Comissão líquida = Comissão × (1 − refund%)
          EPC break-even = Comissão líquida × CVR
          CPC máx ≈ EPC break-even
          CPC SCALE ≈ CPC máx / 1,3
          eCPA máx ≈ Comissão líquida
erros_comuns:
  - "Google direct link em vertical restrita"
  - "MaxWeb sem postback"
  - "Escalar no lucro do dia 1 ignorando refund"
  - "EPC do marketplace ≠ seu EPC"
  - "PMax no dia 1 sem conversão confiável"
  - "Misturar redes/ofertas sem naming"
  - "Claims agressivos (ban)"
  - "Um criativo só até fadiga"
  - "Usar HopLink criptografado como URL final do anúncio"
  - "Confundir URL do produtor com link de afiliado"
  - "Rodar \"Maximizar conversões\" sem estratégia madura"
  - "Aprovar rascunho achando que a página publicada mudou (o que muda é o presellHtml)"
  - "Ler badge de fonte sem conferir se a resposta veio em modo simulado"
  - "Tratar tendência indisponível como tendência estável"
  - "Simular compra em campanha real: o webhook de teste grava a venda e marca ATIVA"
  - "Escalar produto próprio sem medir o custo de IA que a esteira já queimou"
