# Catálogo de verticais — subsídio para a criação de campanhas.
#
# Cada número aqui entra em conta de break-even, teto de lance e decisão de kill/scale.
# Por isso todo valor carrega procedência: de onde veio, quanta confiança merece e
# quando precisa ser reconferido. Valor sem procedência não entra neste arquivo.
#
# origem:
#   heuristica-interna  — estimativa da operação, não medida. Trate como ponto de partida.
#   dado-proprio        — medido em campanha nossa (exige campo `amostra`).
#   fonte-externa       — marketplace/estudo público (exige campo `url`).
#
# Ao substituir uma heurística por dado próprio, troque `origem`, preencha `amostra`
# e suba `confianca`. É assim que o subsídio melhora com o tempo.

schema: 1
atualizado_em: '2026-08-29'
verticais:
  - id: weight-loss
    label: 'Weight Loss'
    cvr_default:
      valor: 1.5
      unidade: percentual
      origem: heuristica-interna
      confianca: baixa
      revisar_em: '2026-11-29'
      nota: >-
        Estimativa de CVR de clique-para-venda usada como default da calculadora do wizard.
        Não foi medida: substitua por dado-proprio assim que houver campanha com volume.
      referencias:
        - url: 'https://www.dtcpages.com/blog/ecommerce-conversion-rate-benchmarks-2026'
          titulo: 'Ecommerce Conversion Rate Benchmarks 2026 — dados de 21 lojas Shopify'
          acessado_em: '2026-08-29'
          metrica: 'pedidos / sessões da loja própria, 179M+ sessões, jan/2025 a jun/2026'
          valor_citado: 'mediana 2,07% no geral; 2,42% na faixa de AOV abaixo de US$ 60'
          por_que_nao_substitui: >-
            Mede tráfego misturado da loja do próprio dono da oferta (orgânico, direto,
            recorrente). Aqui o número é venda de tráfego pago frio atravessando uma bridge
            até a página de um terceiro, que converte bem abaixo disso.
        - url: 'https://www.fyresite.com/ecommerce-conversion-rate-by-industry-benchmarks/'
          titulo: 'Ecommerce Conversion Rate by Industry — Health & Wellness'
          acessado_em: '2026-08-29'
          metrica: 'compras / sessões, média combinada de canais e dispositivos'
          valor_citado: 'Health & Wellness entre 1,5% e 2,5%'
          por_que_nao_substitui: >-
            A própria fonte não declara de onde tirou os números e adverte que a média
            crua esconde variação por canal. Serve de teto plausível, não de medição.
    keywords:
      origem: heuristica-interna
      confianca: media
      nota: >-
        Sementes por camada de intenção. A = fundo de funil/comercial, B = comparação/review,
        C = problema/dor, D = informacional. Não são keywords finais: são o ponto de partida
        que a pesquisa de keywords expande e o relatório de termos de pesquisa corrige.
      A:
        - 'how to lose weight after 40'
        - 'belly fat problem'
        - 'why cant I lose weight'
        - 'stubborn fat causes'
      B:
        - 'best weight loss supplement'
        - 'natural way to lose weight'
        - 'fast metabolism boost'
        - 'weight loss that works'
      C:
        - 'weight loss supplement review'
        - 'supplement vs diet comparison'
        - 'top rated weight loss 2026'
        - 'does supplement work'
      D:
        - 'buy weight loss supplement'
        - 'official weight loss site'
        - 'order supplement online'
        - 'get weight loss solution'
    negativas:
      origem: heuristica-interna
      confianca: alta
      nota: >-
        Negativas preventivas aplicadas antes do primeiro clique. Cada uma existe para
        barrar um tipo de busca que gasta orçamento sem chance de compra.
      termos:
        - 'free'
        - 'grátis'
        - 'surgery'
        - 'reddit'
        - 'wikipedia'
        - 'diy'
        - 'homemade'
        - 'recipe'
        - 'exercise only'
        - 'gym'

