# Glossário operacional — o vocabulário que o app explica ao usuário.
# Cada verbete diz o que é (definition) e por que muda uma decisão de campanha (por_que_importa).
# Editar aqui; lib/generated/catalogo-conhecimento.ts é gerado por yarn subsidios:build.
schema: 1
termos:
  - termo: Custo por Clique
    sigla: CPC
    categoria: google-ads
    definicao: Quanto você paga cada vez que alguém clica no seu anúncio.
    por_que_importa: É a variável que você controla no leilão. Se o CPC real passar
      do CPC máximo viável (break-even), a campanha perde dinheiro por
      definição.
  - termo: Custo por Aquisição
    sigla: CPA
    categoria: google-ads
    definicao: Quanto custa, em mídia, gerar uma conversão (venda/lead).
    por_que_importa: "A regra do 3× compara a comissão com o CPA: a comissão precisa
      pagar ao menos 3× o CPA estimado para o teste valer a pena."
  - termo: Custo por Mil Impressões
    sigla: CPM
    categoria: google-ads
    definicao: Custo para exibir o anúncio 1.000 vezes (comum em Display/YouTube).
    por_que_importa: Em campanhas de topo de funil você compra atenção, não clique —
      o CPM diz se essa atenção está cara.
  - termo: Taxa de Cliques
    sigla: CTR
    categoria: google-ads
    definicao: Cliques ÷ impressões. Mede o quanto o anúncio atrai quem o vê.
    por_que_importa: "CTR baixo derruba o Quality Score e encarece o CPC. CTR de
      Search saudável em afiliados: 4–8%+."
  - termo: Taxa de Conversão
    sigla: CVR
    categoria: google-ads
    definicao: "Conversões ÷ cliques. No contexto de afiliado: vendas ÷ cliques no
      hoplink."
    por_que_importa: "É o multiplicador da economia inteira: CVR 1% significa que
      cada venda precisa pagar 100 cliques."
  - termo: Retorno sobre Investimento em Anúncios
    sigla: ROAS
    categoria: google-ads
    definicao: Receita ÷ gasto em anúncios. ROAS 2.0 = cada R$1 vira R$2.
    por_que_importa: "Meta prática de afiliado: ROAS ≥ 2 no scale (o break-even é ROAS 1)."
  - termo: Anúncio Responsivo de Pesquisa
    sigla: RSA
    categoria: google-ads
    definicao: "Formato do Google Search: até 15 títulos (30 caracteres) e 4
      descrições (90), combinados automaticamente."
    por_que_importa: É o formato que o Gerador RSA do app produz. Título espelhando
      a keyword aumenta relevância e reduz CPC.
  - termo: Performance Max
    sigla: PMax
    categoria: google-ads
    definicao: Tipo de campanha automatizada que roda em todas as redes do Google ao
      mesmo tempo.
    por_que_importa: Só faz sentido com conversão confiável configurada — PMax no
      dia 1 sem histórico queima orçamento (erro comum nº 5).
  - termo: Demand Gen
    sigla: null
    categoria: google-ads
    definicao: Campanha de geração de demanda (YouTube, Discover, Gmail) com
      criativos visuais.
    por_que_importa: "Canal para verticais em que Search é caro ou proibido pelo
      produtor (ex.: LymphFlow só permite Display/YouTube)."
  - termo: Índice de Qualidade
    sigla: QS
    categoria: google-ads
    definicao: "Nota 1–10 do Google por keyword: CTR esperado, relevância do anúncio
      e experiência da landing page."
    por_que_importa: QS alto = pagar menos pelo mesmo lugar. Presell lenta ou
      irrelevante derruba o QS e o lucro junto.
  - termo: Ad Rank
    sigla: null
    categoria: google-ads
    definicao: Posição no leilão = lance × Quality Score (+ extensões).
    por_que_importa: Explica por que nem sempre quem paga mais aparece primeiro —
      melhorar QS é mais barato que subir lance.
  - termo: Correspondência Exata
    sigla: exact
    categoria: google-ads
    definicao: "Keyword entre [colchetes]: anúncio aparece só para buscas com o
      mesmo significado."
    por_que_importa: Máximo controle e menor volume. Use nas keywords de fundo de
      funil que já provaram converter.
  - termo: Correspondência de Frase
    sigla: phrase
    categoria: google-ads
    definicao: 'Keyword entre "aspas": a busca precisa conter o sentido da frase.'
    por_que_importa: Equilíbrio padrão para teste — controla o tema sem estrangular o volume.
  - termo: Correspondência Ampla
    sigla: broad
    categoria: google-ads
    definicao: "Sem pontuação: o Google expande para tudo que considerar relacionado."
    por_que_importa: Em teste de afiliado com verba curta, broad gasta rápido em
      busca irrelevante. Só com Smart Bidding maduro.
  - termo: Palavras-chave Negativas
    sigla: null
    categoria: google-ads
    definicao: 'Termos para os quais o anúncio NUNCA deve aparecer (ex.: "grátis",
      "download").'
    por_que_importa: Cada clique de curioso custa o mesmo que um clique de
      comprador. Negativas preventivas protegem o orçamento de teste.
  - termo: Termos de Pesquisa
    sigla: null
    categoria: google-ads
    definicao: Relatório do que as pessoas REALMENTE digitaram antes de clicar.
    por_que_importa: "É a mina de ouro da otimização: termos que convertem viram
      keywords exatas; lixo vira negativa."
  - termo: Parcela de Impressões
    sigla: IS
    categoria: google-ads
    definicao: Percentual dos leilões elegíveis em que seu anúncio de fato apareceu.
    por_que_importa: IS baixo por orçamento = campanha estrangulada; IS baixo por
      rank = problema de QS/lance.
  - termo: Recursos/Extensões de Anúncio
    sigla: assets
    categoria: google-ads
    definicao: Sitelinks, frases de destaque, snippets — informações extras no anúncio.
    por_que_importa: Aumentam CTR e Ad Rank de graça. Anúncio de afiliado sem
      extensões compete em desvantagem.
  - termo: Lance Inteligente
    sigla: Smart Bidding
    categoria: google-ads
    definicao: Estratégias automáticas de lance (Maximizar conversões, tCPA, tROAS).
    por_que_importa: Precisa de dados de conversão para funcionar. Em teste frio,
      CPC manual limitado dá mais controle.
  - termo: Tag de Conversão
    sigla: null
    categoria: google-ads
    definicao: Código que informa ao Google quando uma venda/lead aconteceu.
    por_que_importa: Sem conversão rastreada não há otimização automática possível —
      e em afiliado exige postback da rede (S2S).
  - termo: Centro de Transparência de Anúncios
    sigla: null
    categoria: google-ads
    definicao: Ferramenta pública do Google que mostra os anúncios ativos de
      qualquer anunciante.
    por_que_importa: "Espionagem legítima: veja quantos afiliados anunciam o produto
      e que ângulos usam antes de entrar."
  - termo: Política de Saúde Personalizada
    sigla: null
    categoria: google-ads
    definicao: Restrição do Google a anúncios que assumem condições de saúde do usuário.
    por_que_importa: Vertical nutra vive no limite dela. Copy "seu linfedema" =
      reprovação; "drenagem linfática" genérico = ok.
  - termo: Ganho por Clique
    sigla: EPC
    categoria: afiliados
    definicao: Receita de comissão ÷ cliques enviados. O marketplace mostra o EPC
      médio da oferta.
    por_que_importa: Se o seu CPC pago > EPC da oferta, a conta não fecha. EPC do
      marketplace ≠ seu EPC (erro comum nº 4).
  - termo: Gravity
    sigla: null
    categoria: afiliados
    definicao: "Métrica do ClickBank: quantos afiliados distintos fizeram venda nas
      últimas 12 semanas (ponderado)."
    por_que_importa: "Sweet spot 20–150: prova de que vende sem estar saturado.
      Gravity 300 = guerra de lances."
  - termo: HopLink
    sigla: null
    categoria: afiliados
    definicao: Seu link de afiliado ClickBank (rastreia o clique até a venda).
    por_que_importa: É como a comissão chega em você. Sempre teste o hoplink antes
      de rodar tráfego.
  - termo: Presell / Página Ponte
    sigla: bridge
    categoria: afiliados
    definicao: Página SUA entre o anúncio e a página de vendas do produtor (review,
      advertorial, quiz).
    por_que_importa: "Obrigatória na prática: aquece o clique, filtra curiosos e
      protege sua conta Google das claims do produtor."
  - termo: Carta de Vendas em Vídeo
    sigla: VSL
    categoria: afiliados
    definicao: Página de vendas do produtor em formato de vídeo longo.
    por_que_importa: VSLs convertem bem em tráfego frio mas demoram — o visitante
      precisa chegar pré-vendido da sua presell.
  - termo: Landing de Dois Passos
    sigla: TSL
    categoria: afiliados
    definicao: "Funil do produtor em duas etapas (ex.: texto → checkout). Alguns
      produtores exigem passar por ela."
    por_que_importa: Pular etapas do funil oficial (direct linking ao carrinho) é
      proibido por muitos produtores — LymphFlow bane por isso.
  - termo: Rebill / Recorrência
    sigla: null
    categoria: afiliados
    definicao: Comissão que se repete enquanto o cliente pagar (assinaturas).
    por_que_importa: "Rebill muda a matemática: um CPA que parece caro no mês 1 vira
      lucro no mês 3."
  - termo: Ticket Médio
    sigla: AOV
    categoria: afiliados
    definicao: Valor médio do pedido, incluindo upsells (Average Order Value).
    por_que_importa: Oferta com upsells fortes paga comissão média maior que o preço
      do front-end sugere.
  - termo: Taxa de Reembolso
    sigla: refund %
    categoria: afiliados
    definicao: Percentual de vendas devolvidas (ClickBank permite reembolso em até
      60 dias).
    por_que_importa: Comissão líquida = comissão × (1 − refund%). Escalar no lucro
      do dia 1 ignorando refund é o erro comum nº 3.
  - termo: Estorno de Comissão
    sigla: clawback
    categoria: afiliados
    definicao: Comissão já paga que a rede retira depois (refund/chargeback).
    por_que_importa: Mantenha reserva de caixa — o dinheiro do painel não é seu até
      passar a janela de reembolso.
  - termo: Whitelist de Afiliado
    sigla: null
    categoria: afiliados
    definicao: Aprovação prévia do produtor para você promover a oferta (via gerente
      de afiliados).
    por_que_importa: Ofertas boas exigem whitelist — rodar sem aprovação = comissão
      estornada e ban. Contato fica na página de afiliado.
  - termo: Bid em Marca
    sigla: brand bidding
    categoria: afiliados
    definicao: Anunciar usando o nome do produto/marca como keyword ou no texto do
      anúncio.
    por_que_importa: A maioria dos produtores PROÍBE. Violar = ban imediato. Sempre
      conferir na página de afiliado antes.
  - termo: Link Direto
    sigla: direct linking
    categoria: afiliados
    definicao: Mandar o clique do anúncio direto para a página do produtor, sem presell.
    por_que_importa: Quase sempre proibido pelo produtor e arriscado no Google
      (destino que você não controla pode derrubar SUA conta).
  - termo: Cloaking
    sigla: null
    categoria: afiliados
    definicao: Mostrar ao Google uma página diferente da que o usuário vê.
    por_que_importa: "Fraude na política do Google: suspensão permanente da conta.
      Nunca — não há campanha que justifique."
  - termo: Página de Ferramentas do Afiliado
    sigla: aff page
    categoria: afiliados
    definicao: "Página do produtor com recursos para afiliados: comissões reais, CPA
      bônus, swipes, criativos, regras e contato ({domínio}/aff, /affiliates,
      /jv)."
    por_que_importa: "REGRA DA CASA: analisar antes de qualquer campanha — ela
      valida ou mata a estratégia (canais proibidos, restrições). O Affiliate
      Page Analyst faz isso no app."
  - termo: Postback / S2S
    sigla: null
    categoria: afiliados
    definicao: Notificação servidor-a-servidor da rede para seu tracker/Google
      quando a venda acontece.
    por_que_importa: Único jeito confiável de levar a conversão de afiliado para
      dentro do Google Ads. MaxWeb sem postback é o erro comum nº 2.
  - termo: Rede CPA
    sigla: null
    categoria: afiliados
    definicao: "Rede que paga por ação fixa (venda/lead) em vez de percentual — ex.:
      MaxWeb, BuyGoods."
    por_que_importa: "CPA fixo simplifica o break-even: você sabe exatamente quanto
      vale cada conversão."
  - termo: Bônus CPA do Produtor
    sigla: null
    categoria: afiliados
    definicao: "Pagamento fixo extra por venda que produtores oferecem a top
      afiliados (ex.: LymphFlow: $180/venda após 50 vendas)."
    por_que_importa: Muda a economia da oferta — a comissão real pode ser bem maior
      que a do marketplace. Está na página de afiliado.
  - termo: CPC de Break-even
    sigla: null
    categoria: afiliados
    definicao: "CPC máximo que empata: comissão líquida × CVR esperada."
    por_que_importa: É o teto de lance de toda campanha. CPC SCALE ≈ break-even ÷
      1,3 dá a margem de lucro.
  - termo: Regra do 3×
    sigla: null
    categoria: afiliados
    definicao: A comissão média deve pagar ao menos 3× o CPA estimado do teste.
    por_que_importa: "Filtro de entrada do Product Hunter: sem 3× de folga,
      variância normal de campanha come o lucro."
  - termo: Camadas de Keywords A/B/C/D
    sigla: null
    categoria: afiliados
    definicao: "Organização do app: A=fundo de funil/comercial, B=comparação/review,
      C=problema/dor, D=informacional."
    por_que_importa: Cada camada tem CPC, CVR e papel diferentes. Teste começa em
      A/B; C alimenta presell; D quase nunca em Search pago.
  - termo: Vertical
    sigla: null
    categoria: afiliados
    definicao: "Nicho de mercado da oferta: nutra/saúde, MMO (make money online),
      sobrevivência, beleza…"
    por_que_importa: Define CPC médio, regras de compliance e sazonalidade — a
      estratégia inteira muda por vertical.
  - termo: Funil
    sigla: null
    categoria: afiliados
    definicao: "Caminho do clique à venda: Bridge (anúncio→presell→oferta), Direct,
      Search-intent, YouTube."
    por_que_importa: O naming das campanhas do app codifica o funil
      (CB_VERT_GEO_CANAL_FUNIL_v1) para o diário e a auditoria compararem iguais
      com iguais.
  - termo: Kill / Scale
    sigla: null
    categoria: afiliados
    definicao: "Decisão binária pós-teste: matar a campanha ou escalar orçamento."
    por_que_importa: "Critério objetivo ANTES do teste (ex.: 2× o gasto da comissão
      em 72h) evita torrar verba em esperança. O Paid Ads Auditor decide isso."
  - termo: Swipe
    sigla: null
    categoria: afiliados
    definicao: Modelo pronto de email/copy fornecido pelo produtor na página de afiliado.
    por_que_importa: Material validado pelo próprio produtor — base legítima para
      seus criativos (adaptando, nunca copiando claims proibidas).
  - termo: Temperatura da Oferta
    sigla: null
    categoria: afiliados
    definicao: "Momento da oferta no mercado: subindo (gravity crescendo), estável,
      saturando ou morrendo."
    por_que_importa: Entrar em oferta morrendo é pagar CPC de leilão cheio por
      conversão em queda. O Caçador de Produtos avalia isso.
