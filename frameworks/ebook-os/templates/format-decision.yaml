  versao: "0.1.0-rascunho"

capacidades_nucleo:
  login: false
  progresso_persistente: false
  notificacoes: false
  liberacao_temporal: false
  feedback_adaptativo: false
  validacao_servidor: false
  depende_online: false

justificativa: "[preencher: por que o núcleo sobrevive ou não como documento offline]"

sinais_observados:
