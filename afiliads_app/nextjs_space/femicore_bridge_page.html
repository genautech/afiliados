<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FemiCore: O Suplemento Natural para o Controle da Bexiga</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f4f7f6; }
        .container { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); background-color: white; }
        h1, h2, h3 { color: #2c3e50; }
        h1 { font-size: 2.5em; text-align: center; margin-bottom: 10px; }
        h2 { font-size: 1.8em; margin-bottom: 15px; }
        h3 { font-size: 1.3em; margin-bottom: 10px; }
        p { color: #34495e; line-height: 1.6; margin-bottom: 1em; }
        a { text-decoration: none; color: #27ae60; }
        a:hover { text-decoration: underline; }
        .highlight { color: #c0392b; font-weight: bold; }
        .success-color { color: #27ae60; font-weight: bold; }
        .text-center { text-align: center; }
        .mb-20 { margin-bottom: 20px; }
        .mt-30 { margin-top: 30px; }
        .cta-button { background-color: #27ae60; color: white; padding: 15px 30px; border-radius: 8px; text-decoration: none; font-size: 1.2em; font-weight: bold; display: inline-block; transition: background-color 0.3s ease; }
        .cta-button:hover { background-color: #229954; }
        .cta-button-red { background-color: #c0392b; color: white; padding: 15px 30px; border-radius: 8px; text-decoration: none; font-size: 1.3em; font-weight: bold; display: inline-block; margin-top: 20px; transition: background-color 0.3s ease; }
        .cta-button-red:hover { background-color: #a0291f; }
        .disclosure-box { background-color: #fff3cd; border-color: #ffeeba; color: #856404; padding: 10px; margin-bottom: 20px; border-radius: 5px; }
        .grid-2-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .grid-3-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background-color: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e9ecef; }
        .testimonial-card { background-color: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef; }
        .offer-card { background-color: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef; text-align: center; }
        .offer-card.best-value { background-color: #e8f5e9; border: 2px solid #27ae60; position: relative; }
        .best-value-badge { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); background-color: #27ae60; color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; font-weight: bold; }
